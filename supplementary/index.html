<!doctype html>
<!--
  Welcome page of the supplementary-material build (scripts/build-supplementary.mjs).
  The build fills {{TITLE}}, {{SUBTITLE}} and {{INTRO}} from the config and replaces
  <!-- SCENES --> with one card per scene (thumbnail, name, file size, optional description).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #15181c; --panel: #1e2227; --border: #2c3238; --text: #d9dee3; --muted: #8b949e;
        --accent: #22c3ee; --accent-soft: rgba(34, 195, 238, 0.14);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; color: var(--text);
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0; min-height: 100vh; line-height: 1.5;
        background: radial-gradient(900px 420px at 50% -120px, rgba(34, 195, 238, 0.16), transparent 70%), var(--bg);
      }
      main { max-width: 1120px; margin: 0 auto; padding: 56px 24px 40px; }
      header { margin-bottom: 32px; text-align: center; }
      .subtitle {
        display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(34, 195, 238, 0.35);
        border-radius: 999px; padding: 3px 12px; margin-bottom: 14px;
      }
      h1 { font-size: 28px; font-weight: 650; margin: 0 auto; max-width: 980px; text-wrap: balance; color: #fff; letter-spacing: -0.01em; line-height: 1.25; }
      .intro { margin: 12px auto 0; max-width: 680px; color: var(--muted); }

      .scenes { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
      .scene {
        display: block; flex: 0 1 340px; color: inherit; text-decoration: none; background: var(--panel);
        border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
        transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      }
      .scene:hover, .scene:focus-visible {
        border-color: var(--accent); transform: translateY(-3px); outline: none;
        box-shadow: 0 10px 30px -12px rgba(34, 195, 238, 0.45);
      }
      .scene .thumb {
        aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; color: var(--muted);
        background: radial-gradient(circle at 50% 45%, #2b323a, #1a1e23 75%);
      }
      .scene .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 10px; transition: transform 0.25s; }
      .scene:hover .thumb img { transform: scale(1.03); }
      .scene .info { padding: 12px 14px 0; display: flex; align-items: center; gap: 10px; }
      .scene .info:last-child { padding-bottom: 14px; }
      .scene .info kbd {
        background: var(--accent); color: #062a33; border: none; font-weight: 700; min-width: 22px; text-align: center;
        border-radius: 6px; padding: 1px 6px;
      }
      .scene .name { font-weight: 600; color: #fff; }
      .scene .meta { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
      .scene .desc { padding: 4px 14px 14px; font-size: 13px; color: var(--muted); }

      footer {
        margin-top: 32px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px;
        font-size: 13px; color: var(--muted);
      }
      footer span { white-space: nowrap; }
      footer .lead { flex-basis: 100%; text-align: center; margin: 0 0 2px; color: var(--text); }
      kbd {
        font-family: inherit; font-size: 12px; background: #262b31; border: 1px solid #3a4148; border-bottom-width: 2px;
        border-radius: 4px; padding: 0 6px; white-space: nowrap; color: var(--text);
      }
      footer kbd { color: var(--accent); border-color: rgba(34, 195, 238, 0.4); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="subtitle">{{SUBTITLE}}</div>
        <h1>{{TITLE}}</h1>
        {{INTRO}}
      </header>
      <div class="scenes">
        <!-- SCENES -->
      </div>
      <footer>
        <p class="lead">Click a scene to explore it in 3D. The controls are shown inside.</p>
      </footer>
    </main>
    <script>
      // Number keys open the corresponding scene.
      addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const cards = document.querySelectorAll(".scene");
        const i = Number(e.key) - 1;
        if (i >= 0 && i < cards.length) cards[i].click();
      });
    </script>
  </body>
</html>
